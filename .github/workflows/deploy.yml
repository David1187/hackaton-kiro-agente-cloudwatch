name: Deploy CDK Stacks

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    name: CDK Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU (arm64 emulation for Docker asset bundling)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js (for CDK CLI)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Synth
        run: cdk synth --all

      - name: CDK Diff (show pending changes)
        run: cdk diff --all 2>&1 | tee cdk-diff-output.txt

      - name: Upload diff as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdk-diff
          path: cdk-diff-output.txt

      - name: CDK Deploy
        run: cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Verify stack status
        run: |
          for stack in TodoCrudStatefulStack TodoCrudStatelessStack SelfHealingAgentStack; do
            STATUS=$(aws cloudformation describe-stacks --stack-name "$stack" --region ${{ env.AWS_REGION }} --query "Stacks[0].StackStatus" --output text)
            echo "✅ $stack: $STATUS"
            if [[ "$STATUS" != *"COMPLETE"* ]]; then
              echo "❌ ERROR: $stack is in unexpected state: $STATUS"
              exit 1
            fi
          done

      - name: Upload deploy outputs
        uses: actions/upload-artifact@v7
        with:
          name: cdk-outputs
          path: cdk-outputs.json