[pytest]
# Python 3.13 target runtime
# Run from: services/crud_api/
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Hypothesis settings profile — fast for CI, set to 'ci' for thorough runs
# Override with: pytest --hypothesis-profile=ci
addopts = -v --tb=short
